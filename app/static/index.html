<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕节奏与镜头边界校正台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🎬 字幕节奏与镜头边界校正台</div>
  <div class="project-switch">
    <select id="projectSelect" title="历史项目"></select>
    <button id="newProjectBtn" type="button">新建项目</button>
  </div>
</header>

<main>
  <!-- 导入面板 -->
  <section id="importPanel" class="panel">
    <h2>1. 导入素材</h2>
    <form id="importForm">
      <div class="form-grid">
        <label>项目名称
          <input name="name" value="未命名项目" required>
        </label>
        <label>字幕文件（.srt / .vtt）
          <input name="subtitle" type="file" accept=".srt,.vtt,text/vtt" required>
        </label>
        <label>镜头 JSON（含起止毫秒，可选）
          <input name="shots_file" type="file" accept=".json,application/json">
        </label>
      </div>
      <div class="form-grid settings">
        <label>CPS 字符速率上限
          <input name="cps_limit" type="number" step="0.1" min="0.1" value="21">
        </label>
        <label>最小间隔（毫秒）
          <input name="min_gap_ms" type="number" step="1" min="0" value="40">
        </label>
        <label>镜头边界容差（毫秒）
          <input name="tolerance_ms" type="number" step="1" min="0" value="200">
        </label>
      </div>
      <div class="actions">
        <button type="submit" class="primary">导入并分析</button>
      </div>
      <p class="hint">字素计数遵循 Unicode UAX #29 扩展字素簇；校正仅平移起点、保持时长不变。</p>
    </form>
  </section>

  <!-- 工作台 -->
  <section id="workspace" class="panel hidden">
    <div class="ws-head">
      <h2 id="projectTitle">项目</h2>
      <div class="ws-actions">
        <button id="adoptAllBtn" type="button" class="primary">采纳全部提案</button>
        <a id="exportJson" class="btn" href="#" target="_blank">导出 JSON</a>
        <a id="exportZip" class="btn" href="#">导出 JSON+SRT(ZIP)</a>
        <a id="exportSrt" class="btn" href="#">导出 SRT</a>
        <button id="deleteProjectBtn" type="button" class="danger">删除项目</button>
      </div>
    </div>

    <form id="settingsForm" class="form-grid settings compact">
      <label>CPS 上限
        <input name="cps_limit" type="number" step="0.1" min="0.1">
      </label>
      <label>最小间隔 ms
        <input name="min_gap_ms" type="number" step="1" min="0">
      </label>
      <label>边界容差 ms
        <input name="tolerance_ms" type="number" step="1" min="0">
      </label>
      <button type="submit" class="primary">应用参数重新求解</button>
    </form>

    <div id="stats" class="stats"></div>
    <div id="conflicts" class="conflicts"></div>

    <div class="table-wrap">
      <table id="cueTable">
        <thead>
          <tr>
            <th>#</th><th>cue_id</th><th>原文（哈希）</th>
            <th>原起→止 (ms)</th><th>时长</th><th>字素</th><th>CPS</th>
            <th>检测</th><th>提案 起→止</th><th>Δ</th><th>状态/操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
